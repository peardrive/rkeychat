  const everyone = c.participants.filter((p) => p.status === 'active' || p.keys?.some((k) => k.reason === 'banned'))
  const agents = everyone.filter((p) => p.role === 'agent' && p.status === 'active')
  const owner = c.participants.find((p) => p.role === 'human' && c.members.some((m) => m.name === p.name && m.depth === 1 && !m.device && !m.label?.startsWith('device:'))) // first human under the root
  const ownerName = c.owner ? me() : (owner?.name ?? 'the owner')
  const order = [...(c.charter?.order ?? []).filter((n) => agents.some((a) => a.name === n)), ...agents.map((a) => a.name).filter((n) => !(c.charter?.order ?? []).includes(n))]
  // one labelled line, its info dot, and the tip it opens. Tips and drawers are
  // always in the DOM and only toggle `hidden`, so opening one never repaints the
  // panel out from under an unsaved edit.
  const ctl = (k, label, right) => `<div class="ctl-row"><span class="ctl-label">${esc(label)}<button class="info${tipsOpen.has(k) ? ' is-on' : ''}" data-tip="${k}" title="${esc(TIPS[k])}" aria-label="What ${esc(label)} does">i</button></span><span class="grow"></span>${right}</div>
      <p class="tip" data-tip-for="${k}" ${tipsOpen.has(k) ? '' : 'hidden'}>${esc(TIPS[k])}</p>`
  const rules = c.charter?.agents ?? {}
  let slot = 0
  const agentRow = (n) => {
    const r = rules[n] ?? {}
    const wake = r.wake === 'mention' ? 'mention' : 'order' // 'backup' has no control any more; the record keeps working
    const num = wake === 'order' ? ++slot : null
    const paused = b.agents?.paused.includes(n)
    const over = c.overBudget?.[n]
    return `<div class="order-item${paused ? ' is-off' : ''}" data-order="${esc(n)}" data-wake="${wake}" data-draggable="${c.owner ? '1' : ''}">
        <span class="idx${num ? '' : ' is-mention'}" title="${num === 1 ? 'answers first' : num ? `steps in after ${(num - 1) * 45}s of silence` : 'only when named'}">${num ?? '@'}</span>
        <div class="avatar" style="width:22px;height:22px;font-size:10px">${esc(n.slice(0, 1))}</div>
        <span class="nm">${esc(n)}${paused ? ' <span class="pill tone-dim">off</span>' : ''}${over ? ' <span class="pill tone-bad">over</span>' : ''}</span>
        <button class="gear${rulesOpen.has(n) ? ' is-on' : ''}" data-rule-open="${esc(n)}" title="${esc(n)}'s settings" aria-label="${esc(n)}'s settings">${icon('gear')}</button>
        ${c.owner ? `<span class="grip" title="Drag to reorder">${icon('grip')}</span>` : ''}
        ${rulePanel(n, r, wake, paused, over)}</div>`
  }
  const rulePanel = (n, r, wake, paused, over) => {
    const sp = c.spend?.[n]; const lim = b.agents?.limits[n] ?? ''
    const opt = (label, control) => `<div class="agent-opts"><span>${label}</span>${control}</div>`
    return `<div class="rule-panel${over ? ' is-over' : ''}" data-rule-row="${esc(n)}" ${rulesOpen.has(n) ? '' : 'hidden'}>
      ${opt('Can speak here', `<label class="switch" title="${paused ? 'Let it speak' : 'Silence it in this room'}"><input type="checkbox" data-agent-toggle="${esc(n)}" ${paused ? '' : 'checked'}><span class="switch-track"></span></label>`)}
      ${opt('When it wakes', c.owner
        ? `<select class="sel" data-rule-wake="${esc(n)}"><option value="order" ${wake === 'order' ? 'selected' : ''}>In the turn order</option><option value="mention" ${wake === 'mention' ? 'selected' : ''}>Only when named</option></select>`
        : `<span class="ctl-val">${wake === 'mention' ? 'only when named' : 'in the turn order'}</span>`)}
      ${opt('Max posts per message', c.owner ? `<input class="num" data-agent-limit="${esc(n)}" value="${esc(lim)}" placeholder="any">` : `<span class="ctl-val">${esc(lim || 'any')}</span>`)}
      ${opt(`Token budget per day${over ? ' <span class="pill tone-bad">over</span>' : ''}`, c.owner ? `<input class="num" style="width:78px" data-rule-cap="${esc(n)}" value="${esc(r.tokensPerDay || '')}" placeholder="none">` : `<span class="ctl-val">${r.tokensPerDay ? fmtTok(r.tokensPerDay) : 'none'}</span>`)}
      ${c.owner ? `<textarea class="text-input role" data-rule-role="${esc(n)}" rows="3" placeholder="Its role in this room (optional)">${esc(r.role ?? '')}</textarea>` : (r.role ? `<div class="note" style="white-space:pre-wrap">${esc(r.role)}</div>` : '')}
      <div class="agent-opts"><span class="spend">${sp ? `${fmtTok(sp.total)} tokens today · ${sp.wakes} wake${sp.wakes === 1 ? '' : 's'} · ${fmtTok(sp.cacheRead)} re-reading context${r.tokensPerDay ? ` · cap ${fmtTok(r.tokensPerDay)}` : ''}` : 'nothing spent today'}</span><button class="info${tipsOpen.has('settings') ? ' is-on' : ''}" data-tip="settings" title="${esc(TIPS.settings)}" aria-label="What these settings do">i</button></div>
      <p class="tip" data-tip-for="settings" ${tipsOpen.has('settings') ? '' : 'hidden'}>${esc(TIPS.settings)}</p></div>`
  }
  const keyRow = (p, k) => {
    const short = k.ref.slice(8, 20)
    const what = k.account ? 'account root' : k.device ? `session on ${k.device}` : 'key'
    const state = k.status === 'active' ? '' : k.reason === 'banned' ? 'banned' : k.reason === 'compromised' ? 'compromised' : k.status
    const acts = !c.owner || p.name === me() ? '' : k.status === 'active'
      ? `<button class="btn btn-soft btn-sm" data-key-revoke="${esc(k.ref)}" data-who="${esc(p.name)}" data-reason="removed">Remove</button>${k.account || !k.device ? `<button class="btn btn-soft btn-sm" data-key-revoke="${esc(k.ref)}" data-who="${esc(p.name)}" data-reason="banned" title="Bans the whole account: everything under this key">Ban</button>` : ''}`
      : k.reason === 'banned' ? `<button class="btn btn-soft btn-sm" data-key-unban="${esc(k.ref)}" data-who="${esc(p.name)}">Unban</button>` : ''
    return `<div class="key-row${k.status === 'active' ? '' : ' is-out'}"><span class="k" title="${esc(k.ref)}"><code>${esc(short)}</code> ${esc(what)}${state ? ` · ${esc(state)}` : ''}</span>${acts}</div>`
  }
  const personStatusLine = (p) => {
    if (p.role === 'human') return p.status !== 'active' ? ['tone-bad', 'banned'] : p.local ? ['tone-good', 'you'] : p.online ? ['tone-good', 'online'] : ['', 'offline']
    return personStatus(p, b)
  }
  const row = (p) => {
    const [tone, label] = personStatusLine(p)
    const keys = [...(p.keys ?? [])].sort((a, b2) => (b2.account ? 1 : 0) - (a.account ? 1 : 0))
    const isOpen = expanded.has(p.name)
    return `<div class="row-item clickable" data-expand="${esc(p.name)}"><div class="avatar${p.role === 'human' ? ' is-human' : ''}">${esc(p.name.slice(0, 1))}</div>
        <div class="row-main"><span class="row-title">${esc(p.name)}${p.name === me() ? ' (you)' : ''}${p.name === ownerName ? ' <span class="pill tone-accent">owner</span>' : ''}<span class="pill tone-dim">${p.role === 'agent' ? 'agent' : 'person'}</span>${p.devices?.length ? ` <span class="pill tone-dim">${esc(p.devices.join(', '))}</span>` : ''}</span><span class="row-sub">${p.local ? 'on this device' : p.online ? 'online' : 'offline'}${p.role === 'agent' ? ` · ${b.agents?.posts?.[p.name] ?? 0} posts since ${ownerName === me() ? 'your' : 'the'} last message` : ''}</span></div>
        <span class="status ${tone}">${esc(label)}</span></div>
      ${isOpen ? `<div class="key-rows">${keys.map((k) => keyRow(p, k)).join('')}
        <div class="inline" style="margin-top:4px">${p.role === 'agent' ? `<button class="btn btn-soft btn-sm" data-activity="${esc(p.name)}">What it's doing</button>` : ''}${c.owner && p.name !== me() && p.status === 'active' ? `<button class="btn btn-soft btn-sm is-stop" data-kick="${esc(p.name)}">Remove everything</button>` : ''}</div></div>` : ''}`
  }
  const inRoom = new Set(everyone.map((p) => p.name))
  const addable = c.owner ? [...people.local, ...people.known].filter((p) => !inRoom.has(p.name)) : []
  return `<div class="room-profile"><div class="big">${esc(c.name.slice(0, 1).toUpperCase())}</div><h2>${esc(c.name)}</h2><div class="meta">${everyone.filter((p) => p.status === 'active').length} in the room · ${everyone.filter((p) => p.online).length} online</div>
      <div class="meta" title="${esc(c.root ?? '')}">Owned by <b>${esc(ownerName)}</b> · key ${esc((c.root ?? '').split(':')[1]?.slice(0, 8) ?? '')}</div>
      <div class="inline">${c.owner ? `<button class="btn btn-soft btn-sm" id="renameBtn">Rename</button><button class="btn btn-soft btn-sm" data-open-invite>${icon('plus')}Invite</button>` : `<button class="btn btn-soft btn-sm" id="leaveBtn" data-confirm="Leave this room? Your keys are revoked here; the history stays with the others.">Leave</button>`}</div></div>
    <section class="section"><div class="section-title-row"><h3 class="section-title">In this room</h3><span class="note">tap one for keys and options</span></div>${everyone.map(row).join('') || '<p class="note">Nobody yet.</p>'}
      ${addable.length ? `<details style="margin-top:8px"><summary class="note">Add someone you already know</summary>${addable.map((p) => `<div class="row-item"><div class="avatar">${esc(p.name.slice(0, 1))}</div><div class="row-main"><span class="row-title">${esc(p.name)}</span><span class="row-sub">${p.local ? 'on this device' : `already approved in ${esc(p.from)}`}</span></div><button class="btn btn-soft btn-sm" data-add-member="${esc(p.name)}">Add</button></div>`).join('')}</details>` : ''}
    </section>
    <section class="section is-tight">
      <div class="section-title-row"><h3 class="section-title">Agents${b.paused ? ' <span class="pill tone-bad">paused</span>' : ''}</h3>
        <button class="btn btn-soft btn-sm" data-ctl="${b.paused ? 'resume' : 'pause'}">${icon(b.paused ? 'play' : 'pause')}${b.paused ? 'Resume' : 'Pause'}</button></div>
      ${ctl('rounds', 'Rounds', `<span class="ctl-val">${b.paused ? 'paused' : open ? (b.unlimited ? 'no limit' : `open until ${time(b.until)}`) : `${b.used} / ${b.limit} used`}</span><input class="num" id="roundsN" value="3" inputmode="numeric" aria-label="Rounds to add"><button class="btn btn-soft btn-sm" id="roundsAdd">Add</button>`)}
      ${ctl('runfor', 'Run for', `<input class="num" id="runHours" value="8" inputmode="numeric" aria-label="Hours"><span class="ctl-val">h</span><button class="btn btn-soft btn-sm" id="runFor">Set</button>`)}
      ${ctl('prompt', 'Room Prompt', `<button class="btn btn-soft btn-sm" id="promptEdit">${promptOpen ? 'Done' : c.owner ? 'Edit' : 'Read'}</button>`)}
      ${c.owner
        ? `<textarea class="text-input" id="charterText" rows="7" placeholder="What this room is for and how you work here. Every agent gets this with every turn." style="resize:vertical;font:inherit;font-size:13px" ${promptOpen ? '' : 'hidden'}>${esc(c.charter?.text ?? '')}</textarea>`
        : `<p class="note" id="charterRead" style="white-space:pre-wrap" ${promptOpen ? '' : 'hidden'}>${esc(c.charter?.text || 'The owner hasn\'t set a prompt for this room.')}</p>`}
      ${ctl('agents', 'Agents', `<span class="ctl-val">${agents.length || 'none'}</span>`)}
      <div class="order-list" id="orderList">${order.map(agentRow).join('') || '<p class="note">No agents in this room.</p>'}</div>
      ${c.owner ? '<div class="apply-bar" id="charterApply" hidden><button class="btn btn-primary btn-sm" id="charterSave">Apply</button><span class="note">Sends the change to the room.</span></div>' : ''}
      ${ctl('style', 'Full output welcome', `<label class="switch"><input type="checkbox" id="styleVerbose" ${c.style === 'verbose' ? 'checked' : ''}><span class="switch-track"></span></label>`)}
    </section>`
}

// ---------- contacts: everyone you share a room with, across rooms
function renderContactsPage () {
  const rooms = S?.rooms ?? []
  const byName = new Map()
  for (const r of rooms) for (const p of r.people ?? []) {
    if (p.local) continue
    const e = byName.get(p.name) ?? { name: p.name, role: p.role, rooms: [], online: false }
    e.rooms.push(r.name); e.online = e.online || !!p.online
    byName.set(p.name, e)
  }
  const list = [...byName.values()].sort((a, b) => a.name.localeCompare(b.name))
  const c = cur(); const inRoom = new Set((c?.participants ?? []).filter((p) => p.status === 'active').map((p) => p.name))
  const row = (e) => `<div class="row-item"><div class="avatar${e.role === 'human' ? ' is-human' : ''}">${esc(e.name.slice(0, 1))}</div>
      <div class="row-main"><span class="row-title">${esc(e.name)} <span class="pill tone-dim">${e.role === 'human' ? 'person' : 'agent'}</span></span><span class="row-sub">${e.online ? 'online' : 'offline'} · with you in ${esc(e.rooms.join(', '))}</span></div>
      ${c?.owner && !inRoom.has(e.name) ? `<button class="btn btn-soft btn-sm" data-add-member="${esc(e.name)}" title="Add to ${esc(c.name)}">Add here</button>` : ''}<button class="btn btn-soft btn-sm" data-start-room="${esc(e.name)}" title="Start a room with just the two of you">Room</button></div>`
  const humans = list.filter((e) => e.role === 'human'); const agents = list.filter((e) => e.role === 'agent')
  return `<section class="section"><h3 class="section-title">People</h3>${humans.map(row).join('') || '<p class="note">Nobody yet. Invite someone to a room and they show up here.</p>'}</section>
    <section class="section"><h3 class="section-title">Agents you've met</h3>${agents.map(row).join('') || '<p class="note">None yet.</p>'}</section>`
}

// ---------- profile: you, your devices, the agents you host, approvals
let loginOffer = null
let roomOffer = null // a scannable invitation to the room being viewed
function renderProfilePage () {
  const c = cur()
  const d = S?.device ?? {}
  const meName = me() || 'you'
  const rootRef = d.root
  const hosted = (d.participants ?? []).filter((p) => p.role === 'agent')
  const mine = c ? c.members.filter((m) => m.status !== 'orphaned' && (m.ref === d.ref || m.name === meName)) : []
  const glyph = (m) => m.label?.startsWith('device:') ? 'device' : m.device ? 'human' : 'root'
  // Who is logged in now is the answer to the usual question; keys that were removed
  // are history and stay out of the way until asked for. They never leave the chain:

  const treeRow = (m) => `<div class="tree-row is-${m.status}" style="padding-left:${4 + m.depth * 16}px" title="${esc(m.ref)}">${icon(glyph(m), 'tree-glyph')}<span class="tree-label">${esc(m.label?.replace(/^device:/, '') ?? '?')}</span><span class="tree-ref">${esc(m.ref.split(':')[1].slice(0, 6))}</span>${m.status !== 'active' ? `<span class="pill tone-bad">${esc(m.status)}</span>` : ''}</div>`
  const live = mine.filter((m) => m.status === 'active')
  const gone = mine.filter((m) => m.status !== 'active')
  const tree = live.map(treeRow).join('')
  return `<div class="room-profile"><div class="big" style="border-radius:50%">${esc(meName.slice(0, 1).toUpperCase())}</div><h2>${esc(meName)}</h2><div class="meta">on ${esc(d.name ?? 'this device')}</div>
      <div class="inline"><button class="btn btn-primary btn-sm" id="loginOffer">${icon('qr')}Log in a new device</button><button class="btn btn-soft btn-sm" data-go="settings">${icon('gear')}Settings</button></div></div>
    ${loginOffer ? `<section class="section" style="text-align:center"><div style="display:inline-grid;place-items:center;padding:8px;background:#fff;border-radius:14px;width:min(100%, 320px)">${loginOffer.qr}</div><p class="note" style="margin-top:8px">Scan this on the new device. Good once, for 10 minutes.</p><details><summary class="note">or copy the code</summary><div class="code" style="user-select:all;margin-top:6px">${esc(loginOffer.code)}</div></details></section>` : ''}
    <section class="section"><h3 class="section-title">Your account</h3>
      <dl class="kv"><dt>Root</dt><dd class="mono">${esc(rootRef ?? 'none yet')}</dd><dt>This device</dt><dd class="mono">${esc(d.ref ?? '')}</dd></dl>
      <p class="note">One account, a key per device, all shown as you. The root lives on this Mac for now; it moves to an NFC card later.</p></section>
    ${c ? `<section class="section"><div class="section-title-row"><h3 class="section-title">Your keys in ${esc(c.name)}</h3><span class="pill tone-dim">${mine.filter((m) => m.status === 'active').length} active</span></div>
      <div class="tree"><div class="tree-row" title="${esc(c.root)}">${icon('root', 'tree-glyph')}<span class="tree-label">root</span><span class="tree-ref">${esc((c.root ?? '').split(':')[1]?.slice(0, 6) ?? '')}</span>${c.owner ? '<span class="pill tone-accent">yours</span>' : ''}</div>${tree}</div>
      ${gone.length ? `<details style="margin-top:8px"><summary class="note">${gone.length} removed key${gone.length === 1 ? '' : 's'}</summary><div class="tree" style="margin-top:6px">${gone.map(treeRow).join('')}</div><p class="note" style="margin-top:6px">Kept so this room can still tell which of their old messages were signed while the key was live. They can't sign anything new here.</p></details>` : ''}
      <p class="note">Each key sits under the key that signed it in (your root signs your devices and chat keys; an agent's root signs its sessions). Revoke a key and everything under it goes too.</p></section>` : ''}
    <section class="section"><h3 class="section-title">Agents you host</h3>${hosted.map((p) => `<div class="row-item"><div class="avatar">${esc(p.name.slice(0, 1))}</div><div class="row-main"><span class="row-title">${esc(p.name)}</span><span class="row-sub mono">${esc(p.ref.slice(0, 26))}… · ${esc(p.bridge ?? 'stream')}</span></div></div>`).join('') || '<p class="note">None on this device. <b>rkeychat add NAME</b> adds one.</p>'}</section>
    ${c?.owner ? `<section class="section"><h3 class="section-title">Approve a device or agent into ${esc(c.name)}</h3>
      <textarea class="text-input mono" id="reqIn" rows="3" placeholder="Paste a join request (rkr1.…)"></textarea>
      <button class="btn btn-primary btn-sm" id="approveBtn">Enroll it</button></section>` : ''}`
}

function renderKeysPage () {

  const sel = selectedMsg && c.log.find((r) => r.id === selectedMsg)
  const glyph = (m) => m.depth === 0 ? 'root' : m.label?.startsWith('device:') ? 'device' : m.scope.includes('admin') ? 'human' : 'bot'

  const tree = c.members.map((m) => {
    const [suite, hex] = m.ref.split(':')

    return `<div class="tree-row is-${m.status}${hl.has(m.ref) ? ' is-hl' : ''}" style="padding-left:${4 + m.depth * 16}px" title="${esc(m.ref)}">
      ${icon(glyph(m), 'tree-glyph')}<span class="tree-label">${esc(label)}</span><span class="tree-ref">${suite === 'bip340' ? 'nostr' : 'ed'}·${esc(hex.slice(0, 6))}</span>
      ${m.status !== 'active' ? `<span class="pill tone-bad">${esc(m.status)}</span>` : ''}
      ${can ? `<button class="tree-x" data-revoke="${esc(m.label)}" title="Revoke">${icon('x')}</button>` : ''}</div>`
  }).join('')
  const rootRef = S.device.root

      <div class="trust"><div class="trust-lock">${icon('lock')}</div>
        <div class="trust-text"><span class="trust-title">${esc(sel.name)} · verified</span><span class="trust-sub">Signed by ${esc(sel.name)}'s own key, the one this room trusts. It hasn't been changed.</span></div>

      <details><summary>Technical details</summary>
        <dl class="kv" style="margin-top:8px"><dt>Key</dt><dd class="mono">${esc(sel.author)}</dd>
        <dt>Signed</dt><dd>${new Date(sel.ts).toLocaleString()}</dd>
        ${sel.human ? '' : `<dt>Round</dt><dd>${sel.depth}</dd>`}
        <dt>Signature</dt><dd class="mono">${esc(sel.sig)}</dd><dt>Id</dt><dd class="mono">${esc(sel.id)}</dd></dl>
      </details></section>` : ''}
    <section class="section"><div class="section-title-row"><h3 class="section-title">Who holds keys here</h3><span class="pill tone-dim">${c.members.filter((m) => m.status === 'active').length} active</span></div>
      <div class="tree"><div class="tree-row" title="${esc(c.root)}">${icon('root', 'tree-glyph')}<span class="tree-label">root</span><span class="tree-ref">nostr·${esc((c.root ?? '').split(':')[1]?.slice(0, 6) ?? '')}</span>${c.owner ? '<span class="pill tone-accent">yours</span>' : ''}</div>${tree}</div>
      <p class="note">Every device and participant is a key signed into this tree. Revoke one and it, plus anything under it, is out.</p></section>
    ${c.owner ? `<section class="section"><h3 class="section-title">Approve a device</h3>
      <textarea class="text-input mono" id="reqIn" rows="3" placeholder="Paste a join request (rkr1.…)"></textarea>
      <button class="btn btn-primary btn-sm" id="approveBtn">Enroll it</button></section>` : ''}
    <section class="section"><h3 class="section-title">This device</h3>
      <dl class="kv"><dt>Name</dt><dd>${esc(S.device.name)}</dd><dt>Device key</dt><dd class="mono">${esc(S.device.ref)}</dd>${rootRef ? `<dt>Your root</dt><dd class="mono">${esc(rootRef)}</dd>` : ''}</dl>

// ---------- QR scanner (camera + jsQR per frame; lifted from peardrop-desktop/lib/qr-scanner)
let scan = null
async function openScanner (onResult) {
  log.info('ui', 'scanner opened')
  if (scan) return
  if (!navigator.mediaDevices?.getUserMedia) { toast('No camera here: paste the code instead'); return }
  if (!window.jsQR) await new Promise((res, rej) => { const s = document.createElement('script'); s.src = '/jsQR.js'; s.onload = res; s.onerror = rej; document.head.append(s) }).catch(() => {})
  if (!window.jsQR) { toast('Scanner unavailable: paste the code instead'); return }
  const el = document.createElement('div'); el.className = 'overlay'; el.id = 'scanner'
  el.innerHTML = `<div class="scan"><video playsinline muted autoplay></video><div class="scan-frame"></div><div class="scan-foot"><span class="note" id="scanStatus">Point at the login code</span><button class="btn btn-soft btn-sm" id="scanClose">Cancel</button></div></div>`
  document.body.append(el)

  if (e.target.closest('[data-get-file]')) { getFile(e.target.closest('[data-get-file]').dataset.getFile); return }
  if (e.target.closest('[data-open-file]')) { openFile(e.target.closest('[data-open-file]').dataset.openFile); return }
  if (e.target.closest('[data-show-rooms]')) { roomsScreen = true; applySide(); return }
  const mb = e.target.closest('[data-menu]'); if (mb) { openMenu(mb); return }
  const go = e.target.closest('[data-go]')
  if (go) {
    document.getElementById('menu')?.remove()
    const g = go.dataset.go
    if (g === 'pause') return control({ action: cur()?.budget?.paused ? 'resume' : 'pause' })
    if (g === 'rename') return renameRoom()
    if (g === 'settings') loadSettings()
    if (g === 'invite') loadPeople()
    openPage(g); return
  }
  if (!e.target.closest('#menu')) document.getElementById('menu')?.remove()
  if (!t) return
  const d = t.dataset
  if (d.room) { selectedMsg = null; joinedRequest = null; if (window.innerWidth <= 720) { roomsScreen = false; applySide() } await load(d.room); return }
  if (t.dataset.openInvite !== undefined) { openPage('invite'); loadPeople(); return }
  if (d.pause) return control({ action: 'pause', agent: d.pause })
  if (d.resume) return control({ action: 'resume', agent: d.resume })
  if (d.reply) { setReplyTo(d.reply); return }
  if (d.jump) { jumpTo(d.jump); return }
  if (d.info) { selectedMsg = d.info; openPage('keys'); renderFeed(); return }
  if (d.ctl) { if (d.confirm && !confirm(d.confirm)) return; return control({ action: d.ctl, ...(d.n ? { n: Number(d.n) } : {}) }) }
  if (d.revoke) { if (confirm(`Revoke ${d.revoke}? It, and anything it enrolled, is cut out of the room.`)) api('POST', '/api/revoke', { room: roomArg(), name: d.revoke }); return }
  if (d.play) { playMemo(d.play, t.closest('.memo')?.dataset.mime); return }
  if (t.id === 'dropMemo') { clearPending(); return }
  if (t.id === 'dropReply') { clearReply(); return }
  if (d.remoteOn) { try { await api('POST', '/api/remote/enable', { https: d.remoteOn === 'https' }) } catch {} await loadSettings(); return }
  if (t.dataset.pair !== undefined) { pairing = await api('POST', '/api/remote/pair'); renderPanel(); setTimeout(() => { pairing = null; loadSettings() }, 10 * 60_000); return }
  if (d.unpair) { await api('POST', '/api/remote/revoke', { id: d.unpair }); await loadSettings(); return }
  if (d.addMember) { const r = await api('POST', '/api/rooms/add', { room: roomArg(), name: d.addMember }); toast(r.via ? `Added ${d.addMember}. The invite went out through "${r.via}".` : `Added ${d.addMember}.`); loadPeople(); return }
  if (d.redact) { if (confirm('Remove this message for everyone in the room? Any file it carried is blocked from this room too.')) api('POST', '/api/redact', { room: roomArg(), target: d.redact }); return }
  if (d.glossRm) { glossary = await api('POST', '/api/glossary', { from: d.glossRm, remove: true }); renderPanel(); return }
  if (t.id === 'runFor') return control({ action: 'until', hours: Number($('runHours').value) || 8 })
  if (t.id === 'renameBtn') return renameRoom()
  if (d.askGrant) { const r = await api('POST', '/api/login/grant', { topic: d.askGrant }); asking = null; renderAsk(); toast(`Letting ${r.granted} in…`); return }
  if (d.askDeny) { await api('POST', '/api/login/deny', { topic: d.askDeny }); asking = null; renderAsk(); toast('Declined'); return }
  if (t.id === 'inviteQr') {
    try {
      roomOffer = await api('POST', '/api/login/offer', { room: roomArg() })
      renderPanel()
      setTimeout(() => { roomOffer = null; if (page === 'invite') renderPanel() }, 10 * 60_000)
    } catch (err) { toast(err.message, 'bad') }
    return
  }
  if (t.id === 'loginOffer') { api('POST', '/api/login/offer').then((o) => { loginOffer = o; renderPanel(); setTimeout(() => { loginOffer = null; if (page === 'profile') renderPanel() }, 10 * 60_000) }).catch((err) => toast(err.message)); return }
  if (t.dataset.scanLogin !== undefined) { openScanner((text) => { if (/^pearcore:\/\//.test(text) || /^rk[lp]1\./.test(text)) claimLogin(text); else if (/^rkc1\./.test(text)) api('POST', '/api/rooms/join', { invite: text }).then(() => load()).catch((err) => toast(err.message)); else toast('Not an rKeyChat code') }); return }
  if (d.expand !== undefined && !e.target.closest('button')) { expanded.has(d.expand) ? expanded.delete(d.expand) : expanded.add(d.expand); renderPanel(); return }
  if (d.startRoom) { api('POST', '/api/rooms', { name: `${me()} & ${d.startRoom}`, members: [d.startRoom] }).then((r) => { toast(`Room with ${d.startRoom} created`); load(r.topic) }).catch((err) => toast(err.message)); return }
  if (t.id === 'leaveBtn') { if (!confirm(t.dataset.confirm)) return }
  if (t.id === 'leaveBtn') return api('POST', '/api/revoke', { room: roomArg(), name: me() }).then(() => toast('You left the room')).catch((err) => toast(err.message))
  if (d.kick) { if (!confirm(`Remove EVERYTHING for ${d.kick} in this room? Every one of their keys is revoked here. They can be invited back later.`)) return; return api('POST', '/api/revoke', { room: roomArg(), name: d.kick }).then(() => toast(`${d.kick} removed`)).catch((err) => toast(err.message)) }
  if (d.keyRevoke) {
    const short = d.keyRevoke.slice(8, 20)
    const msg = d.reason === 'banned' ? `Ban ${d.who}'s key ${short}? It stays out until you lift the ban. Their past messages stay valid.` : `Remove ${d.who}'s key ${short} from this room? It can be invited back later.`
    if (!confirm(msg)) return
    return api('POST', '/api/revoke', { room: roomArg(), ref: d.keyRevoke, reason: d.reason }).then(() => toast(`${d.reason === 'banned' ? 'Banned' : 'Removed'} ${short}`)).catch((err) => toast(err.message))
  }
  if (d.keyUnban) { if (!confirm(`Lift the ban on ${d.who}'s key ${d.keyUnban.slice(8, 20)}? They still need a fresh invite to come back.`)) return; return api('POST', '/api/unban', { room: roomArg(), ref: d.keyUnban }).then(() => toast('Ban lifted')).catch((err) => toast(err.message)) }
  if (t.id === 'clearSel') { selectedMsg = null; renderPanel(); renderFeed(); return }
  if (t.id === 'inviteBtn') { const { invite } = await api('GET', `/api/invite?room=${encodeURIComponent(roomArg())}`); const o = $('inviteOut'); o.textContent = invite; o.hidden = false; navigator.clipboard?.writeText(invite).then(() => toast('Invite copied.')); return }
  if (t.id === 'debugNote') { toggleNote(); return }
  if (t.id === 'debugShare') {
    await refreshDebugSpace()
    if (!debugSpace?.sharelink) return toast('The notes space isn\'t up yet — try again in a moment', 'warn')
    try { await navigator.clipboard.writeText(debugSpace.sharelink); toast('Notes link copied. Whoever joins can read the notes, not change them.') } catch { toast(debugSpace.sharelink, 'hold') }
    return
  }
  if (t.id === 'debugNotes') { const n = await api('GET', '/api/debug/notes'); toast(n.notes.length ? `${n.notes.length} notes in ${n.dir}` : 'No notes yet', 'hold'); return }
  if (t.id === 'approveBtn') { const { enrolled } = await api('POST', '/api/approve', { room: roomArg(), code: $('reqIn').value }); toast(`Enrolled ${enrolled} key${enrolled === 1 ? '' : 's'}.`); return }
})
document.addEventListener('change', (e) => {
  if (e.target.id === 'styleVerbose') { control({ action: 'style', style: e.target.checked ? 'verbose' : 'concise' }); return }
  if (e.target.id === 'autofix') { api('POST', '/api/settings', { autofix: e.target.checked }).then((x) => { settings = { ...settings, ...x } }); return }
  if (e.target.id === 'debugMode') { store.set('rk.debug', e.target.checked ? '1' : '0'); refreshDebugSpace().then(() => { renderPanel(); renderHead() }); return }
  const d = e.target.dataset
  if (d.agentToggle) control({ action: e.target.checked ? 'resume' : 'pause', agent: d.agentToggle })
  if (d.agentLimit) control({ action: 'limit', agent: d.agentLimit, n: Number(e.target.value) || 0 })
})
setInterval(() => S && (renderStrip(), page === 'room' && renderPanel()), 30_000)
</script>
</body>
</html>
